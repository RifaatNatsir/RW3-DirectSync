name: Build & Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Test, Build APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform & Build-Tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Package release artifacts
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            TAG_NAME="${INPUT_TAG}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"

          mkdir -p release-artifacts
          APK_NAME="RW3-DirectSync-${TAG_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/${APK_NAME}"
          (cd release-artifacts && sha256sum "${APK_NAME}" > SHA256SUMS.txt)
          ls -lh release-artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="release-artifacts/RW3-DirectSync-${TAG_NAME}-debug.apk"
          CHECKSUM_FILE="release-artifacts/SHA256SUMS.txt"

          cat > release-notes.md <<EOF
          ### RW3-DirectSync ${TAG_NAME}

          APK Debug siap-install untuk **Redmi Watch 3** (\`minSdk 26\` / Android 8.0+, \`targetSdk 35\`).

          #### Sorotan Fitur
          - **DirectSync BLE & Auto-Reconnect**: sinkronisasi langsung detak jantung, tidur, aktivitas harian, sesi olahraga, dan kontrol media dua arah.
          - **Design System & UI Redesign**: Dashboard Bento, Tren & Timeline Tidur, Detail Detak Jantung, Detail Sesi Olahraga (rute GPS MapLibre, zona HR, pace/cadence), Watchface & Wallpaper Manager, serta Sync Center & Terminal.
          - **Impor Riwayat Mi Fitness (Health Connect)**: impor histori tidur, sesi latihan, rute GPS, HR, langkah, kalori, dan SpO2 pada Android 14+.
          - **Cari Perangkat Dua Arah & Notifikasi Pintar**: sinyal getar ke jam, Cari HP dari jam, whitelist notifikasi per aplikasi, dan ekspor Webhook HTTP.

          > **Catatan:** Rilis ini menggunakan APK Debug (\`debug\` keystore). Jika sebelumnya menginstal APK dari sumber berbeda dengan signing key lain, silakan hapus instalasi lama terlebih dahulu sebelum memasang APK ini.
          EOF

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${APK_FILE}" "${CHECKSUM_FILE}" --clobber
          else
            gh release create "${TAG_NAME}" \
              "${APK_FILE}" \
              "${CHECKSUM_FILE}" \
              --title "RW3 DirectSync ${TAG_NAME}" \
              --notes-file release-notes.md \
              --generate-notes || \
            gh release create "${TAG_NAME}" \
              "${APK_FILE}" \
              "${CHECKSUM_FILE}" \
              --title "RW3 DirectSync ${TAG_NAME}" \
              --notes-file release-notes.md
          fi
